services:
  db:
    image: mysql:8.0
    container_name: escola-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp123
    ports:
      - "3304:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro,Z
    networks:
      escola-net:
        ipv4_address: 172.20.0.2

  wordpress:
    image: wordpress:latest
    container_name: escola-wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "9004:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp123
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://blog.escola.local:9004');
        define('WP_SITEURL', 'http://blog.escola.local:9004');
    volumes:
      - wp_data:/var/www/html
    networks:
      escola-net:
        ipv4_address: 172.20.0.3

  app:
    build:
      context: ../app
    image: escola-app:latest
    container_name: escola-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8004:8004"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: wp
      DB_PASSWORD: wp123
      DB_NAME: escola
      PORT: 8004
    networks:
      escola-net:
        ipv4_address: 172.20.0.4

volumes:
  db_data:
  wp_data:

networks:
  escola-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24